[build]
  functions = "netlify/functions"

# The June 2026 market post was replaced by a permanent, regularly updated report.
[[redirects]]
  from = "/blog/tampa-bay-market-update-june-2026"
  to = "/blog/tampa-bay-market-update"
  status = 301
  force = true

[[redirects]]
  from = "/blog/tampa-bay-market-update-june-2026.html"
  to = "/blog/tampa-bay-market-update"
  status = 301
  force = true

# One address per page: send every .html address to its clean URL so search
# engines don't index two copies. Netlify still serves the .html file at the
# clean URL. The Google verification file and /admin are intentionally left out.

